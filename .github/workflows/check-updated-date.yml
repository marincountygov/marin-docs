name: Check updated date

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check-updated-date:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node scripts/stamp-updated-dates.js --check
